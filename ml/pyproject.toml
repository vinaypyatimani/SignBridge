[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trisign-ml"
version = "0.1.0"
description = "Multilingual (DGS, ASL, LSE) sign recognition: data prep, training, ONNX export"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "torch>=2.3",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
extract = ["mediapipe>=0.10.14", "opencv-python-headless>=4.9"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["trisign_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a tiny model and exports it to ONNX (about a minute on CPU)"]
